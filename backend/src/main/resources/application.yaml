spring:
  application:
    name: dotori
  config:
    # 루트 폴더의 .env에서 민감정보를 읽는다 (환경변수로 이미 주입된 값이 항상 우선)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dotori_town}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 DDL 스크립트(노션)가 책임진다. Hibernate 는 건드리지 않는다.
      #
      # 예전에는 update 였다. 그 상태로 앱을 띄우면 DDL 로 만든 스키마 위에 엔티티 모양대로
      # 컬럼을 덧붙여, point_wallets 에 child_id(DDL)와 user_id(엔티티)가 함께 생기고
      # 지웠던 linked_accounts.balance 가 되살아나는 사고가 났다.
      #
      # 엔티티가 DDL 과 완전히 맞은 뒤에는 validate 로 올린다. 그러면 둘이 어긋날 때
      # 런타임이 아니라 기동 단계에서 걸린다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # TIMESTAMPTZ 를 KST 기준으로 읽고 쓴다.
          # 서버 타임존이 달라도 거래 시각이 어긋나지 않게 하려는 것이다.
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

finance:
  base-url: ${FINANCE_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1}
  api-key: ${FINANCE_API_KEY:}
  institution-code: ${FINANCE_INSTITUTION_CODE:00100}
  fintech-app-no: ${FINANCE_FINTECH_APP_NO:001}
  auth-text: ${FINANCE_AUTH_TEXT:도토리}
