spring:
  application:
    name: dotori
  config:
    # 루트 폴더의 .env에서 민감정보를 읽는다 (환경변수로 이미 주입된 값이 항상 우선)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dotori_town}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 미설정 시 무한 대기라, SMTP 장애가 요청 스레드를 계속 붙잡는다
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    hibernate:

      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # TIMESTAMPTZ 를 KST 기준으로 읽고 쓴다.
          # 서버 타임존이 달라도 거래 시각이 어긋나지 않게 하려는 것이다.
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600
  # Refresh Token 쿠키의 Secure 속성. HTTPS를 쓰는 운영 환경에서는 COOKIE_SECURE=true로 주입한다
  cookie-secure: ${COOKIE_SECURE:false}

finance:
  base-url: ${FINANCE_BASE_URL:https://finopenapi.ssafy.io/ssafy/api/v1}
  api-key: ${FINANCE_API_KEY:}
  institution-code: ${FINANCE_INSTITUTION_CODE:00100}
  fintech-app-no: ${FINANCE_FINTECH_APP_NO:001}
  auth-text: ${FINANCE_AUTH_TEXT:도토리}
