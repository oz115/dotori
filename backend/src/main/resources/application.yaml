spring:
  application:
    name: dotori
  config:
    # 루트 폴더의 .env에서 민감정보를 읽는다 (환경변수로 이미 주입된 값이 항상 우선)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dotori_town}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # TIMESTAMPTZ 를 KST 기준으로 읽고 쓴다.
          # 서버 타임존이 달라도 거래 시각이 어긋나지 않게 하려는 것이다.
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600
  # Refresh Token 쿠키의 Secure 속성. HTTPS를 쓰는 운영 환경에서는 COOKIE_SECURE=true로 주입한다
  cookie-secure: ${COOKIE_SECURE:false}
