spring:
  datasource:
    # docker-compose.local.yml 의 dotori-postgres 를 그대로 쓰되,
    # 개발 데이터를 건드리지 않도록 테스트 전용 DB 를 따로 바라본다.
    #   docker exec dotori-postgres psql -U dotori -d postgres -c "CREATE DATABASE dotori_town_test OWNER dotori;"
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:dotori_town_test}
    username: ${TEST_DB_USERNAME:dotori}
    password: ${TEST_DB_PASSWORD:dotori1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 동시성 테스트가 스레드 수만큼 커넥션을 동시에 요구한다.
      maximum-pool-size: 24

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.bana.dotori: DEBUG
