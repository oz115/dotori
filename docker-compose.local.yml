services:
  postgres:
    image: postgres:16-alpine
    container_name: dotori-postgres
    restart: unless-stopped
    environment:
      # 값을 고정한다. compose 는 루트 .env 를 자동으로 읽는데, 거기 POSTGRES_USER /
      # POSTGRES_PASSWORD 는 QA 용 공용 DB 계정이다. 그대로 물리면 사람마다 다른 계정으로
      # 로컬 컨테이너가 만들어져서 테스트 기본값(dotori/dotori1234)과 어긋난다.
      # 어차피 로컬 전용이고 언제 날려도 되는 DB 라 비밀을 둘 이유가 없다.
      POSTGRES_DB: dotori_town
      POSTGRES_USER: dotori
      POSTGRES_PASSWORD: dotori1234
      TZ: Asia/Seoul
    ports:
      # 호스트 5433 으로 고정한다. ssh -N A505 터널이 5432 를 잡고 있어서,
      # 여기까지 5432 를 쓰면 QA 용 공용 DB 와 포트가 겹친다.
      # 겹치면 기동 실패하거나 (더 나쁘게) 테스트가 공용 DB 로 붙는다.
      # 로컬 도커와 터널을 동시에 켜 둘 수 있게 번호를 갈라 둔다.
      - "${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - dotori-postgres-data:/var/lib/postgresql/data
      # 스키마 원본. 데이터 볼륨이 비어 있을 때만 한 번 실행된다.
      # 스키마를 고친 뒤에는 down -v 로 볼륨을 지우고 다시 띄워야 반영된다.
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotori -d dotori_town"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dotori-network

  redis:
    image: redis:7-alpine
    container_name: dotori-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dotori1234}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dotori-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dotori1234}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dotori-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dotori-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      TZ: Asia/Seoul
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - dotori-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dotori-network

volumes:
  dotori-postgres-data:
  dotori-redis-data:
  dotori-rabbitmq-data:

networks:
  dotori-network:
    driver: bridge
