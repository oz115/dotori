# 모든 테스트의 설정. 테스트 클래스패스가 메인 application.yaml 보다 앞서므로
# 이 파일 하나가 테스트 전체의 설정이 된다.
#
# 팀 결정: 테스트는 H2 가 아니라 PostgreSQL 을 쓴다.
# H2 의 PostgreSQL MODE 는 아래를 그대로 흉내 내지 못해, 통과해도 배포에서 깨진다.
#   - SELECT ... FOR UPDATE 행 잠금 (동시 차감 검증)
#   - TIMESTAMPTZ 와 KST 환산 (거래내역 기간 경계)
#   - 커서 페이징의 정렬·인덱스 거동
#   - CHECK·부분 유니크 제약의 실제 동작
#
# 팀 결정(인프라): 테스트는 각자 로컬 도커 DB 에서 돌린다. 공용 EC2 DB 는 QA 전용이다.
# 예전에는 테스트도 공용 DB 를 썼는데, 여러 명이 동시에 돌리면 서로의 뒷정리에
# 데이터가 쓸려 나가서 재현되지 않는 실패가 무더기로 났다.
#
#   docker compose -f docker-compose.local.yml up -d
#   ./gradlew test
#
# 일부 테스트에 붙어 있는 @ActiveProfiles("test") 는 통합 테스트를 표시하는 관례로
# 남겨 두었다. 별도의 application-test.yaml 은 없고 전부 이 파일을 쓴다.
spring:
  # .env 를 일부러 읽지 않는다. .env 는 앱을 QA 용 공용 DB 에 붙이는 설정이라,
  # 여기서 물려받으면 테스트가 공용 DB 를 지우게 된다. 실수 한 번으로 QA 데이터가
  # 날아가므로 아예 경로를 끊고 아래 기본값(로컬 도커)만 쓴다.

  datasource:
    # 로컬 도커 DB. 기본값이 docker-compose.local.yml 과 맞춰져 있어 설정 없이 바로 돈다.
    # 5433 인 이유는 ssh -N A505 터널이 5432 를 쓰기 때문이다 (compose 주석 참고).
    #
    # stringtype=unspecified 는 메인 설정과 같은 이유다. 네이티브 ENUM 컬럼에
    # @Enumerated(EnumType.STRING) 값을 넣으려면 필요하다.
    url: jdbc:postgresql://${TEST_POSTGRES_HOST:localhost}:${TEST_POSTGRES_PORT:5433}/${TEST_POSTGRES_DB:dotori_town}?stringtype=unspecified
    username: ${TEST_POSTGRES_USER:dotori}
    password: ${TEST_POSTGRES_PASSWORD:dotori1234}
    driver-class-name: org.postgresql.Driver

    hikari:
      # 동시성 테스트가 스레드 수만큼 커넥션을 동시에 요구한다.
      # createWalletIfAbsent 가 REQUIRES_NEW 로 커넥션을 한 개 더 쓰는 것도 감안한 값이다.
      maximum-pool-size: 24

      # 스프링이 테스트 컨텍스트를 여러 개 캐싱하고, 캐시된 컨텍스트는 끝까지 살아 있다.
      # 컨텍스트마다 풀을 24개씩 붙잡고 있으면 서버 max_connections 를 넘겨
      # 뒤에 뜨는 컨텍스트가 "too many clients already" 로 통째로 실패한다.
      # 유휴 커넥션을 0까지 반납시켜, 실제로 일하는 컨텍스트만 커넥션을 쓰게 한다.
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 60000

  # 실제 발송은 하지 않는다. EmailVerificationServiceImpl 이 JavaMailSender 빈을
  # 생성자로 요구하는데, 자동구성은 spring.mail.host 가 있어야 빈을 만들므로
  # 이 블록이 없으면 @SpringBootTest 컨텍스트가 통째로 못 뜬다.
  mail:
    host: localhost
    port: 3025

  jpa:
    hibernate:
      # 스키마는 backend/docker/initdb/01-schema.sql 이 책임진다.
      # 컨테이너가 처음 뜰 때 이미 다 만들어져 있으므로 여기서는 아무것도 하지 않는다.
      # 예전에는 src/test/resources/schema.sql 을 spring.sql.init 로 매번 실행했는데,
      # 그 파일은 지갑 범위 6개 테이블만 담고 있었고 enum 컬럼을 VARCHAR 로 선언해
      # 실제 스키마와 어긋났다. 원본을 DDL 하나로 합치면서 없앴다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

jwt:
  # 테스트 전용 서명 키. 운영 키가 아니고 이 저장소 밖으로 나가지 않는다.
  # 여기 고정해 두는 이유는 컨텍스트를 띄우는 테스트가 JwtTokenProvider 를 함께 올리기 때문이다.
  # 메인 application.yaml 의 ${JWT_SECRET} 에 기대면 각자 .env 에 값을 채워 넣어야만
  # 테스트가 도는데, 그러면 CI 나 새로 받은 사람에게서 전부 컨텍스트 로딩 실패로 깨진다.
  secret: Kfc5n4etu9b908ckpMRCOJ/3qahjHYwXp0wwFX0BXuUH9hVaubZyTXxc0qYr6Q+S
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

logging:
  level:
    com.bana.dotori: DEBUG
